# pick（絵の上の範囲を選ぶ）の整合性チェックのテスト用（crates/aa-verify/tests/pick.rs）。
# 手袋の跡の指を選ぶと扉の指紋が選べるようになり、指紋を選ぶと人物を指摘する。やめると抜け出せない所へ行く
id: pick
title: 範囲を選ぶ
player: me
characters:
  me: { name: 私 }
  ito: { name: 糸鋸, profile: { description: 刑事 } }
evidence: {}
flags:
  glove: false
start: { scene: s }
parts:
  - id: p
    kind: investigation
    title: 探偵パート
    scenes:
      s:
        - pick: 指紋を検出する所を選んでください。
          images: [hand, door]
          areas:
            - name: 人さし指
              area: [10, 10, 20, 20]
              image: 0
              when: not glove
              then:
                - me: 手袋の跡だ。
                - set: { glove: true }
                - goto: s
            - name: 扉の指紋
              area: [100, 50, 30, 30]
              image: 1
              when: glove
              then:
                - demand: 指紋の持ち主は？
                  present:
                    ito:
                      - me: 一致した。
                  wrong:
                    - me: 一致しない。
          miss:
            - me: 何もない。
          quit:
            - goto: dead
        - end: true
      dead:
        - me: 抜け出せない。
        - goto: dead
