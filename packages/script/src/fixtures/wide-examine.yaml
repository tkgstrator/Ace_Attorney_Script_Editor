# 横長（512 ドット）の背景の場所。調べる範囲は背景の座標で、話を進める所は画面の幅より右にだけある
# （crates/aa-verify/tests/data/wide-examine.json はこれを export-ir.ts で IR にしたもの）
id: ch
title: 第1話
player: me
characters:
  me: { name: 私 }
evidence: {}
flags:
  locked: false
start: { scene: intro }
parts:
  - id: inv
    kind: investigation
    title: 探偵パート
    scenes:
      intro:
        - investigate: hall
      done:
        - me: 終わり。
        - end: true
    places:
      hall:
        name: 廊下
        background: wide
        examineScroll: not locked
        examine:
          - id: door
            area: [400, 40, 60, 100]
            then:
              - me: 扉だ。
              - goto: done
          - id: vase
            area: [20, 60, 30, 40]
            then:
              - me: 花瓶だ。
