<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>法廷レイアウト試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#101217;
  --surface:#181b22;
  --surface-2:#20242d;
  --line:#2d323d;
  --text:#e8e4da;
  --muted:#9aa0ab;
  --accent:#e9b949;
  --accent-ink:#1b1506;
  --pixel:"PM12","Zen Kaku Gothic New",system-ui,sans-serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
html,body{background:var(--bg);color:var(--text);}
body{font-family:var(--sans);font-size:14px;line-height:1.7;}
.page{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px;}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;}
h1{font-family:var(--pixel);font-size:24px;font-weight:400;margin:0;letter-spacing:.04em;line-height:1.2;text-wrap:balance;}
header p{margin:0;color:var(--muted);}
.stage{background:#000;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;min-height:180px;overflow:hidden;}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;max-width:100%;}
#screen:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
.group{background:var(--surface);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.label{font-family:var(--pixel);font-size:12px;color:var(--muted);letter-spacing:.08em;}
.seg{display:flex;flex-wrap:wrap;gap:6px;}
.seg button{font:inherit;font-size:13px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);padding:5px 11px;cursor:pointer;}
.seg button:hover{border-color:var(--muted);}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;}
.seg button:focus-visible,.check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;}
.check input{accent-color:var(--accent);width:16px;height:16px;}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-variant-numeric:tabular-nums;}
dt{color:var(--muted);}
dd{margin:0;}
.keys{color:var(--muted);font-size:13px;margin:0;}
kbd{font-family:var(--pixel);font-size:12px;background:var(--surface-2);border:1px solid var(--line);padding:0 5px;color:var(--text);}
@media (max-width:520px){h1{font-size:20px;}}
</style>

</head>
<body>
<main class="page">
  <header>
    <h1>法廷レイアウト試作</h1>
    <p>内部解像度 320×180（16:9）。画像はすべて仮のドット絵です。</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="screen" width="320" height="180" tabindex="0" aria-label="ゲーム画面。クリックかEnterで文章を進めます"></canvas>
  </div>

  <section class="panel" aria-label="表示設定">
    <div class="group">
      <span class="label">場面</span>
      <div class="seg" id="scenes">
        <button type="button" id="sc-court" data-scene="court" aria-pressed="true">法廷</button>
        <button type="button" id="sc-testimony" data-scene="testimony" aria-pressed="false">証言</button>
        <button type="button" id="sc-cross" data-scene="cross" aria-pressed="false">尋問</button>
        <button type="button" id="sc-record" data-scene="record" aria-pressed="false">法廷記録</button>
        <button type="button" id="sc-objection" data-scene="objection" aria-pressed="false">異議あり</button>
      </div>
      <p class="keys">尋問中は証言が緑色になります。「修理票」を2番目の証言につきつけると正解です。</p>
    </div>
    <div class="group">
      <span class="label">文字サイズ</span>
      <div class="seg" id="fontsize">
        <button type="button" id="fs-10" data-size="10" aria-pressed="false">10px</button>
        <button type="button" id="fs-12" data-size="12" aria-pressed="true">12px</button>
      </div>
      <span class="label">拡大方式</span>
      <div class="seg" id="scalemode">
        <button type="button" id="sm-int" data-mode="int" aria-pressed="true">整数倍</button>
        <button type="button" id="sm-fit" data-mode="fit" aria-pressed="false">画面に合わせる</button>
      </div>
      <label class="check"><input type="checkbox" id="guides"> ガイド線を表示</label>
    </div>
    <div class="group">
      <span class="label">現在の寸法</span>
      <dl id="readout"></dl>
    </div>
    <div class="group">
      <span class="label">操作</span>
      <p class="keys"><kbd>クリック</kbd> <kbd>Enter</kbd> 文章を進める<br>
      <kbd>←</kbd> <kbd>→</kbd> 証言の前後（尋問中）<br>
      <kbd>Z</kbd> ゆさぶる　<kbd>X</kbd> 法廷記録<br>
      法廷記録では <kbd>←</kbd><kbd>→</kbd> で選び <kbd>Enter</kbd> でつきつける</p>
    </div>
  </section>
</main>

const W = 320, H = 180;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const painter = g => ({
  R: (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); },
  E: (cx, cy, rx, ry, col) => { g.fillStyle = col; for (let y = -ry; y <= ry; y++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry)))); if (w > 0) g.fillRect(cx - w, cy + y, w * 2, 1); } },
});
function tint(src, col) { const c = mk(src.width, src.height), g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return c; }
function outlined(src, col, r = 1) {
  const c = mk(src.width + r * 2, src.height + r * 2), g = c.getContext('2d'); const s = tint(src, col);
  for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) if (Math.abs(dx) + Math.abs(dy) <= r + (r > 1 ? 1 : 0)) g.drawImage(s, r + dx, r + dy);
  g.drawImage(src, r, r); return c;
}
function hardAlpha(c) { const g = c.getContext('2d'); const id = g.getImageData(0, 0, c.width, c.height); const d = id.data; for (let i = 3; i < d.length; i += 4) d[i] = d[i] >= 128 ? 255 : 0; g.putImageData(id, 0, 0); return c; }

/* ---------- crisp pixel text ---------- */
const M = mk(W, H), mx = M.getContext('2d', { willReadFrequently: true });
const T = mk(W, H), tx = T.getContext('2d');
const fontOf = s => `${s}px PM${s}`;
function mask(lines, size, lh) {
  mx.clearRect(0, 0, W, H); mx.font = fontOf(size); mx.textBaseline = 'alphabetic'; mx.fillStyle = '#fff';
  const base = size === 12 ? 9.6 : 8; // PixelMplus のドット格子に合わせたベースライン
  let w = 1; lines.forEach((l, i) => { mx.fillText(l, 0, i * lh + base); w = Math.max(w, Math.ceil(mx.measureText(l).width)); });
  w = Math.min(W, w + 1); const h = Math.min(H, lines.length * lh + 1);
  const id = mx.getImageData(0, 0, w, h), d = id.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] >= 110 ? 255 : 0;

  L.cells.forEach((c, i) => {
    const sel = i === S.rec.sel;
    box(c.x, c.y, c.w, c.h, sel ? '#43385a' : '#2f2740', sel && (S.frame >> 3) % 2 ? '#ffd88a' : '#5b4d75', '#1a1522');
    ctx.drawImage(EVIDENCE[i].img, c.x + 4, c.y + 4);
  });
  const bs = 10;
  if (S.rec.present) drawButton(L.present.x, L.present.y, L.present.w, L.present.h, 'つきつける', '#b83838', bs);
  drawButton(L.back.x, L.back.y, L.back.w, L.back.h, 'もどる', '#4a4a5c', bs);
}
function drawLife() {
  S.lifeShown += (S.life - S.lifeShown) * 0.08;
  const x = 230, y = 5, w = 86, h = 8;
  R(x - 1, y - 1, w + 2, h + 2, '#15111c'); R(x, y, w, h, '#e8e8e8'); R(x + 1, y + 1, w - 2, h - 2, '#3a1a1a');
  const fw = Math.round((w - 2) * S.lifeShown);
  R(x + 1, y + 1, fw, h - 2, S.lifeShown > 0.35 ? '#46b85c' : '#d8a23a'); R(x + 1, y + 1, fw, 1, S.lifeShown > 0.35 ? '#8ae39a' : '#f3d27a');
}
function drawBanner() {
  const b = S.banner, t = b.t;
  const inT = 280, outT = b.dur - 280;
  const tw = measure(b.label, 12) * 2;
  let x = Math.floor((W - tw) / 2);
  if (!reduceMotion) { if (t < inT) x = Math.round(W + (x - W) * (t / inT)); else if (t > outT) x = Math.round(x - (x + tw) * ((t - outT) / 280)); }
  ctx.globalAlpha = 0.85; R(0, 70, W, 32, '#140c1c'); ctx.globalAlpha = 1;
  R(0, 70, W, 1, '#e9b949'); R(0, 101, W, 1, '#e9b949');
  text(b.label, x, 74, { size: 12, scale: 2, color: '#ffb45c', outline: '#3a1d06', or: 1 });
}
function drawBubble() {
  const B = BUBBLES[S.bubble.kind]; const bx = Math.floor((W - B.img.width) / 2), by = 36;
  ctx.drawImage(B.img, bx, by);
  const tw = measure(B.label, 12) * 2;
  text(B.label, Math.floor((W - tw) / 2), by + 40, { size: 12, scale: 2, color: B.col, outline: '#15111c', or: 2 });
}
function drawGuides(m) {
  ctx.globalAlpha = 0.28; for (let x = 16; x < W; x += 16) R(x, 0, 1, H, '#9fb3ff'); for (let y = 16; y < H; y += 16) R(0, y, W, 1, '#9fb3ff'); ctx.globalAlpha = 1;
  R(160, 0, 1, H, '#ff5c8a'); R(0, 90, W, 1, '#ff5c8a');
  const o = (x, y, w, h, col) => { R(x, y, w, 1, col); R(x, y + h - 1, w, 1, col); R(x, y, 1, h, col); R(x + w - 1, y, 1, h, col); };
  o(SPRITE.x, SPRITE.y, SPRITE.w - 2, SPRITE.h - 1, '#b6ff5c');
  text('立ち絵 128×160', SPRITE.x + 3, SPRITE.y + 3, { size: 10, color: '#b6ff5c', outline: '#000', or: 1 });
  o(m.bx, m.by, m.bw, m.bh, '#4ad0ff');
  text(`テキスト枠 ${m.bw}×${m.bh}`, m.bx + m.bw - 4 - measure(`テキスト枠 ${m.bw}×${m.bh}`, 10), m.by + m.bh - 13, { size: 10, color: '#4ad0ff', outline: '#000', or: 1 });
}
function render() {
  const m = metrics();
  ctx.save();
  if (S.shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 6), Math.round((Math.random() - 0.5) * 4));
  const who = S.who, p = page();
  ctx.drawImage(BG[who], 0, 0);
  const talking = p && p.n === PEOPLE[who].name && p.c !== 'blue' && S.shown < [...p.t].length;
  const mouth = talking && (S.frame >> 2) % 2 === 0 ? 1 : 0;
  ctx.drawImage(SPR[who][S.blink > 0 ? 1 : 0][mouth], SPRITE.x, SPRITE.y);
  ctx.drawImage(FG[who], 0, 0);
  drawLife();
  if (S.cross && !busy()) {
    const lbl = `証言 ${S.stmt + 1}/${STATEMENTS.length}`;
    box(4, 4, measure(lbl, 10) + 10, 14, '#1c3a24', '#bff5c6', '#2c5a37'); text(lbl, 9, 6, { size: 10, color: '#dfffe3' });
  }
  if (!busy()) drawTextbox(m);
  if (S.cross && p && p.stmt && !busy() && !S.rec.open) {
    const b = crossButtons(m);
    drawButton(b.press.x, b.press.y, b.press.w, b.press.h, 'ゆさぶる', '#3564b8', m.size >= 12 ? 12 : 10);
    drawButton(b.present.x, b.present.y, b.present.w, b.present.h, 'つきつける', '#b83838', m.size >= 12 ? 12 : 10);
  }
  if (S.banner) drawBanner();
  if (S.bubble) drawBubble();
  if (S.rec.open) drawRecord();
  ctx.restore();
  if (S.flash > 0) { ctx.globalAlpha = 0.7; R(0, 0, W, H, S.flashCol); ctx.globalAlpha = 1; }
  if (S.guides) drawGuides(m);
}
function update(dt) {
  S.frame++;
  if (S.shake > 0) S.shake--; if (S.flash > 0) S.flash--;
  if (S.blink > 0) S.blink--; else if (--S.nextBlink <= 0) { S.blink = 6; S.nextBlink = 120 + Math.floor(Math.random() * 120); }
  for (const k of ['banner', 'bubble']) { const e = S[k]; if (e) { e.t += dt; if (e.t >= e.dur) { S[k] = null; e.done && e.done(); } } }
  const p = page();
  if (p && !busy()) {
    const len = [...p.t].length;
    if (S.shown < len) {
      S.acc += dt;
      const ch = [...p.t][Math.max(0, S.shown - 1)] || '';
      const wait = '。！？'.includes(ch) ? 180 : '、…'.includes(ch) ? 90 : 32;
      while (S.acc >= wait && S.shown < len) { S.acc -= wait; S.shown++; }
    }
  }
}

/* ---------- input ---------- */
const hit = (r, x, y) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;
function toScreen(e) { const b = cv.getBoundingClientRect(); return [Math.floor((e.clientX - b.left) / b.width * W), Math.floor((e.clientY - b.top) / b.height * H)]; }
cv.addEventListener('click', e => {
  cv.focus({ preventScroll: true });
  const [x, y] = toScreen(e);
  if (S.rec.open) {
    const L = recLayout();
    L.cells.forEach((c, i) => { if (hit(c, x, y)) S.rec.sel = i; });
    if (S.rec.present && hit(L.present, x, y)) present(EVIDENCE[S.rec.sel]);
    else if (hit(L.back, x, y)) S.rec.open = false;
    return;
  }
  const p = page();
  if (S.cross && p && p.stmt && !busy()) {
    const b = crossButtons(metrics());
    if (hit(b.press, x, y)) return press();
    if (hit(b.present, x, y)) { S.rec.open = true; S.rec.present = true; return; }
  }
  advance();
});
cv.addEventListener('keydown', e => {
  const k = e.key;
  if (S.rec.open) {
    if (k === 'ArrowLeft') S.rec.sel = (S.rec.sel + EVIDENCE.length - 1) % EVIDENCE.length;
    else if (k === 'ArrowRight') S.rec.sel = (S.rec.sel + 1) % EVIDENCE.length;
    else if (k === 'Enter' || k === ' ') { if (S.rec.present) present(EVIDENCE[S.rec.sel]); }
    else if (k === 'x' || k === 'X' || k === 'Escape') S.rec.open = false;
    else return;
    e.preventDefault(); return;
  }
  const p = page(); const onStmt = S.cross && p && p.stmt && !busy();
  if (k === 'Enter' || k === ' ') advance();
  else if (k === 'ArrowRight' && onStmt) showStatement(S.stmt + 1);
  else if (k === 'ArrowLeft' && onStmt) showStatement(S.stmt - 1);
  else if ((k === 'z' || k === 'Z') && onStmt) press();
  else if (k === 'x' || k === 'X') { S.rec.open = true; S.rec.present = !!onStmt; }
  else return;
  e.preventDefault();
});

/* ---------- controls & scaling ---------- */
const stage = document.getElementById('stage'), readout = document.getElementById('readout');
function setPressed(groupId, btn) { document.querySelectorAll(`#${groupId} button`).forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false')); }
document.getElementById('scenes').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; setPressed('scenes', b); SCENES[b.dataset.scene](); cv.focus({ preventScroll: true }); });
document.getElementById('fontsize').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; setPressed('fontsize', b); S.size = +b.dataset.size; layout(); });
document.getElementById('scalemode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; setPressed('scalemode', b); S.mode = b.dataset.mode; layout(); });
document.getElementById('guides').addEventListener('change', e => { S.guides = e.target.checked; });
function layout() {
  const aw = stage.clientWidth - 2, ah = Math.max(200, window.innerHeight * 0.74);
  const fit = Math.min(aw / W, ah / H);
  const s = S.mode === 'int' ? Math.max(1, Math.floor(fit)) : fit;
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  stage.style.height = (S.mode === 'int' ? ch + 24 : ch + 2) + 'px';
  const m = metrics(), dpr = window.devicePixelRatio || 1;
  const perLine = Math.floor(m.iw / m.size);
  const rows = [
    ['拡大率', S.mode === 'int' ? `×${Math.round(s)}（整数倍）` : `×${s.toFixed(2)}`],
    ['表示サイズ', `${cw}×${ch} px`],
    ['実ピクセル', `1ドット = ${(s * dpr).toFixed(2).replace(/\.00$/, '')} px`],
    ['テキスト枠', `${m.bw}×${m.bh}（y=${m.by}）`],
    ['1行の文字数', `全角 ${perLine} 字 × ${m.lines} 行`],
    ['立ち絵', '128×160'],
  ];
  readout.innerHTML = rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
}
new ResizeObserver(layout).observe(stage);
window.addEventListener('resize', layout);

let last = performance.now();
function loop(t) { const dt = Math.min(50, t - last); last = t; update(dt); render(); requestAnimationFrame(loop); }
Promise.all([new FontFace('PM10', `url(data:font/woff2;base64,${PM10})`), new FontFace('PM12', `url(data:font/woff2;base64,${PM12})`)].map(f => f.load().then(ff => (document.fonts.add(ff), ff))))
  .catch(() => {}).then(() => { layout(); SCENES.court(); requestAnimationFrame(loop); });
})();
</script>
