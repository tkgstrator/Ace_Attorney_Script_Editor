# yaml-language-server: $schema=../../../schema/scenario.schema.json
#
# サンプル事件「仮面の奇術師」（アンソロジー）
# 蘇る逆転 第1話と第2話のあいだ、成歩堂の二度目の法廷という設定。法廷パートだけ・1 日で決着する第 1 話の形。
# 裁判長の質問・ゆさぶりで現れる証言・選択肢・人物ファイルのつきつけを、千尋の手ほどきつきで順に使う。
# 人物は公式（成歩堂・千尋・亜内・裁判長）と、この事件のゲスト（星野 灯・影山 仁・月岡 光一）。
# ゲストの名前はオリジナルで、立ち絵（pose）と人物ファイルの絵（icon）は公式の人物のものを借りている。
# 証拠品の絵（icon）も、公式の似た証拠品のものを借りている（e<記録の番号>）。
#   星野 灯 = 撮影所のスタッフ、影山 仁 = 星影 宇宙ノ介、月岡 光一 = 人物ファイルの絵だけ第4話の弁護士。

id: masked
title: 仮面の奇術師
player: phoenix
life: 5

defaults:
  penalty: 1
  # 見当違いのつきつけ: 主人公の言い訳 → 裁判長の叱責 → ペナルティ → 心の声（公式の型）
  wrongPresent:
    - show: phoenix
      talk: 19
      idle: 18
    - phoenix: "え、ええと‥‥[wait 10]これが、[wait 6]\nその‥‥関係あるかと‥‥"
    - judge: "弁護人。[wait 12]\nそれが、どう関係するのですかな？"
    - show: judge
      talk: 95
      idle: 92
    - judge: "[speed 4]‥‥ペナルティを与えます。"
    - penalty: true
    - add: { mistakes: 1 }
    - phoenix: "（[speed 4]‥‥心証が悪くなった‥‥。[wait 12]\n　証言をもう一度よく聞こう）"

characters:
  phoenix:
    name: ナルホド
    stand: defense
    pose: { talk: 9, idle: 8 }
  mia:
    name: チヒロ
    stand: bg7                      # 法廷では成歩堂の隣の席（公式の法廷の千尋と同じ背景）
    blip: female
    pose: { talk: 85, idle: 84 }    # 法廷の横向きの絵
    placePose: { talk: 80, idle: 79 } # 控え室の正面の絵
    profile:
      name: 綾里 千尋
      age: 27
      description: "綾里法律事務所の所長。\nぼくの上司で、\nヤリ手の弁護士。"
      icon: r0
  payne:
    name: アウチ
    stand: prosecution
    pose: { talk: 191, idle: 190 }
    profile:
      name: 亜内 武文
      age: 52
      description: "この事件の担当検事。\n押しが弱く、なんとなく\nパッとしない男。"
      icon: r5
  gumshoe:
    name: イトノコ
    stand: witness
    pose: { talk: 143, idle: 142 }
    profile:
      name: 糸鋸 圭介
      age: 30
      description: |-
        所轄署の刑事。
        殺人の初動捜査を担当。
        通称イトノコ刑事。
      icon: r15
  judge: { name: サイバンカン, stand: judge, pose: { talk: 97, idle: 96 } }
  kakari: { name: カカリカン }
  akari:
    name: アカリ
    stand: witness
    blip: female
    pose: { talk: 252, idle: 251 }   # 立ち絵は撮影所のスタッフ（蘇る逆転 第3話）
    profile: { name: 星野 灯, age: 19, description: "この事件の被告人。\n奇術師ゲッコウの\nただひとりの弟子。", icon: r45 }
  kageyama:
    name: カゲヤマ
    stand: witness
    pose: { talk: 237, idle: 236 }   # 立ち絵は星影 宇宙ノ介（蘇る逆転 第2・4話）
    profile:
      name: 影山 仁
      age: 56
      description:
        - when: partner_known
          text: "劇場「銀月座」の\n支配人。昔は\nゲッコウの相方だった。"
        - text: "劇場「銀月座」の\n支配人。事件の夜、\n遺体を見つけた。"
      icon: r22
  gekkou:
    name: ゲッコウ
    profile: { name: 月岡 光一, age: 55, description: "事件の被害者。\n仮面の奇術師\n「ゲッコウ」。", icon: r75 }
  voice_m: { name: ？？？ }
  voice_f: { name: ？？？, blip: female }

evidence:
  badge:
    name: 弁護士バッジ
    icon: e23   # 公式の証拠品の絵を借りる
    description: "ぼくが弁護士である\nことの証。いつも\n胸につけている。"
  autopsy:
    name: 解剖記録
    icon: e6   # 公式の証拠品の絵を借りる
    description: "午後8時40分から\n9時40分に死亡。\n死因は後頭部の打撲。"
  crime_photo:
    name: 現場写真
    icon: e138   # 公式の証拠品の絵を借りる
    description: "警察が着いてすぐ撮った\n楽屋の写真。遺体の\nそばにトロフィー。"
    examine:
      - spot: 遺体
        then:
          - set: { seen_body: true }
          - phoenix: "（タキシードも、髪も‥‥[wait 10]\n　まったくぬれていない）"
          - phoenix: "（床にも、水のあとは\n　ひとつもないな）"
          - phoenix: "（指先も、[wait 8]\n　きれいなままだ）"
      - spot: 机の上
        then:
          - phoenix: "（マントと仮面が置いてある。[wait 10]\n　こっちは、ぐっしょりぬれている）"
          - phoenix: "（したたった水が、[wait 8]机の上に\n　青いしみを作っている‥‥）"
  trophy:
    name: 銀のトロフィー
    icon: e129   # 公式の証拠品の絵を借りる
    description: "凶器。楽屋にあった、\n銀月座の記念の品。"
  program:
    name: 公演プログラム
    icon: e60   # 公式の証拠品の絵を借りる
    description: "第二部は9時〜9時半。\nゲッコウひとりの舞台。\n最後は水中脱出。"
    examine:
      - spot: ゲッコウの歩み
        then:
          - phoenix: "（「仮面の奇術師ゲッコウの歩み」\n　‥‥ここに、何か書いてある）"
          - phoenix: "（「20年前、[wait 8]月岡 光一と\n　影山 仁のコンビで旗上げ」‥‥！）"
          - phoenix: "（影山さんは、[wait 8]昔は\n　先生の相方だったのか！）"
          - if: not partner_known
            then:
              - set: { partner_known: true }
              - say: null
                text: "[speed 5]人物ファイルの《影山 仁》の\nデータを書き加えた。"
                color: blue
      - spot: 第二部の演目
        then:
          - phoenix: "（最後の演目が水中脱出。[wait 10]\n　9時半に幕が下りる）"
  dye:
    name: 舞台用の染料
    icon: e57   # 公式の証拠品の絵を借りる
    description:
      - when: dye_detail
        text: "水を青く染める染料。\n原液が手につくと、\n数日は落ちない。"
      - text: "タンクの水を青く\n染めた、ショー用の\n特殊な染料。"
  stain:
    name: 舞台裏のしみ
    icon: e144   # 公式の証拠品の絵を借りる
    description: "舞台裏の床の青いしみ。\n鑑定では、染料の\n原液と同じもの。"

flags:
  asked_tank: false   # 証言2の水中脱出をゆさぶって「ずぶぬれのまま楽屋へ」を聞き出したか
  seen_body: false    # 現場写真の遺体を詳しく調べて、乾いていると知ったか
  dye_detail: false   # 証言3で、染料の原液が肌について落ちないことを聞き出したか
  partner_known: false # 公演プログラムで、影山が昔ゲッコウの相方だったと知ったか
  asked_water: false  # 証言3で「タンクの水の用意も被告人の仕事」を聞き出したか
  mistakes: 0         # 選択肢やつきつけの間違いの回数

start:
  scene: prologue
  evidence: [badge, autopsy, crime_photo]

gameover: verdict_guilty

scenes:
  # ---- プロローグ（暗い画面の声だけ。だれの声かは、まだ分からない） ----
  prologue:
    - fade: out
      frames: 1
    - location: bg24   # 楽屋（蘇る逆転 第3話の撮影所の楽屋）
    - bgm: BGM023
    - card: "8月22日 午後8時42分\n劇場 銀月座 楽屋"
    - fade: in
      frames: 30
    - voice_m: "[speed 4]‥‥今夜の助手は、[wait 16]\nおまえには任せられん。"
    - voice_f: "そんな‥‥！[wait 12]\n先生、どうしてですか！"
    - voice_m: "いいから、帰れ。[wait 20]\n今夜は、この楽屋に近づくな。"
    - voice_f: "[speed 4]先生なんて‥‥[wait 16]\n先生なんて、大っきらい！"
    - narrate: "――バタン。"
    - fade: out
      frames: 30
    - wait: 30
    - narrate: "[speed 6]‥‥‥‥‥‥"
    - narrate: "――ゴトッ。[shake 20 1]"
    - wait: 60
    - bgm: null
      frames: 60
    - wait: 40
    - goto: lobby

  # ---- 控え室（主人公の立ち絵は出ない） ----
  lobby:
    - location: bg2   # 被告人控え室（蘇る逆転 第1話と同じ背景）
    - show: null
    - card: "8月25日 午前9時47分\n地方裁判所 被告人第1控え室"
    - fade: in
    - bgm: BGM008
    - mia: "なるほどくん。[wait 10]\n顔色が悪いわよ。"
    - phoenix: "千尋さん‥‥。[wait 10]二度目の法廷でも、\n緊張するものは緊張しますよ。"
    - mia: "ふふ。[wait 10]緊張していても、\n証拠はちゃんと見られるでしょう？"
    - show: akari
    - akari: "[speed 4]あの‥‥[wait 10]\n弁護士さん。"
    - show: akari
      talk: 254
      idle: 253
    - akari: "わたし、本当に先生を\n殺してなんかいません。"
    - phoenix: "わかってます、アカリさん。[wait 10]\nだから、ぼくがここにいるんです。"
    - phoenix: "念のため、事件の夜のことを\nもう一度だけ聞かせてください。"
    - akari: "はい‥‥。[wait 10]あの夜は、\n新しい公演の初日でした。"
    - akari: "昔の先生の『瞬間移動』を、\nひとり用に作り直した大技です。"
    - akari: "先生は舞台では仮面を外さないし、\n一言もしゃべらないんです。"
    - akari: "『沈黙の奇術師』。[wait 10]\nそれが、ゲッコウですから。"
    - akari: "わたしはいつも、第二部で\n先生の助手をしてるんです。"
    - akari: "小道具の用意も、[wait 8]\nわたしの仕事で‥‥。"
    - akari: "でも、あの夜は‥‥[wait 12]休憩のあと、\n楽屋口のベンチにいました。"
    - phoenix: "ベンチに？[wait 10]\n助手の仕事は？"
    - akari: "[speed 4]‥‥なんとなく、[wait 10]です。"
    - phoenix: "（‥‥何か、[wait 8]\n　言いにくそうだな）"
    - akari: "幕が下りたあと、先生に\nあいさつしようと思って楽屋に。"
    - akari: "[speed 4]そしたら、[wait 10]先生が‥‥\n床に倒れていて‥‥。"
    - phoenix: "（アカリさんは、ひざの上で\n　両手をきつく握りしめている）"
    - mia: "‥‥きれいな手ね。"
    - akari: "奇術師は、手が命だって。[wait 10]\n先生が、いつも言ってたから。"
    - mia: "そう。[wait 10]‥‥そこへ通りかかったのが、\n劇場の支配人だったのね。"
    - akari: "はい。[wait 10]影山さんです。\n先生とは、古いつきあいの人で‥‥"
    - akari: "わたしのことも、小さいころから\n知ってるのに‥‥。"
    - phoenix: "（その支配人が、[wait 10]今日の\n　検察側の証人か‥‥）"
    - mia: "なるほどくん。[wait 10]\n法廷記録は確かめたかしら？"
    - phoenix: "え、ええ。[wait 10]解剖記録と、\n現場の写真と‥‥。"
    - mia: "法廷記録は、いつでも開いて\n中身を確かめられるわ。"
    - mia: "それに、証拠品の中には\n詳しく調べられる物もある。"
    - mia: "詳細を開いて「調べる」よ。[wait 10]\n写真なんかは、特にね。"
    - mia: "証言と食いちがう証拠品を\n見つけたら、それが突破口よ。"
    - kakari: "弁護人！[wait 10]\n開廷時間です！"
    - phoenix: "（‥‥よし。[wait 12]\n　行こう）"
    - bgm: null
      frames: 30
    - fade: out
      frames: 30
    - goto: opening

  # ---- 開廷 ----
  opening:
    - location: null
    - show: null
    - card: "8月25日 午前10時\n地方裁判所 第2法廷"
    - fade: in
    - se: SE010
    - shake: 10
      strength: 1
    - wait: 40
    - bgm: BGM013
    - judge: "これより、星野 灯の\n法廷を開廷します。"
    - payne: "検察側、[wait 8]\n準備完了しておりますぞ。"
    - phoenix: "弁護側、[wait 8]\n準備完了しています。"
    - phoenix: "（亜内検事‥‥。[wait 12]この前の法廷で\n　勝ったのは、ぼくのほうだ）"
    - payne: "ふふふ‥‥。[wait 10]この前のような\nマグレは、二度とありませんぞ。"
    - judge: "成歩堂くん、でしたな。[wait 12]\nたしか、今日が二度目の法廷。"
    - judge: "念のため、いくつか\n質問させてもらいましょう。"
    - judge: "この事件の被告人の名前を\n答えてください。"
    - goto: q_name

  q_name:
    - choice:
        - text: 星野 灯
          then:
            - phoenix: "被告人は、[wait 8]\n星野 灯さんです。"
            - judge: "よろしい。[wait 10]\n落ち着いているようですな。"
        - text: 影山 仁
          then:
            - phoenix: "影山 仁さん‥‥[wait 10]\nで、したっけ？"
            - judge: "‥‥それは、[wait 10]\n今日の証人の名前ですな。"
            - mia: "（なるほどくん！[wait 10]\n　被告人の名前よ！）"
            - add: { mistakes: 1 }
            - judge: "もう一度聞きます。[wait 10]\n被告人の名前は？"
            - goto: q_name
        - text: 月岡 光一
          then:
            - phoenix: "月岡 光一さん‥‥[wait 10]\nです！"
            - judge: "[speed 4]‥‥弁護人。[wait 12]\nそれは、被害者の名前です。"
            - mia: "（なるほどくん！[wait 10]\n　被告人の名前よ！）"
            - add: { mistakes: 1 }
            - judge: "もう一度聞きます。[wait 10]\n被告人の名前は？"
            - goto: q_name
    - judge: "では、もうひとつ。[wait 10]\n被害者の死因は何ですかな？"
    - mia: "（証拠品を見せるときは、\n　法廷記録から選ぶのよ）"
    - demand: 被害者の死因がわかる証拠品は？
      by: judge
      present:
        autopsy:
          - show: phoenix
            talk: 14
            idle: 13
          - phoenix: "解剖記録によれば、[wait 10]死因は\n後頭部を殴られたことによる打撲。"
          - judge: "けっこう。[wait 10]\nちゃんと目を通していますな。"
      wrong:
        - judge: "‥‥弁護人。[wait 10]それで死因が\nわかるのですかな？"
        - mia: "（死因が書いてあるのは、\n　解剖の記録でしょう？）"
        - add: { mistakes: 1 }
    - goto: prosecution_open

  prosecution_open:
    - judge: "では、亜内検事。[wait 12]\n冒頭弁論をおねがいします。"
    - payne: "被害者は、[wait 8]奇術師ゲッコウ。\n本名、月岡 光一ですな。"
    - payne: "8月22日の夜、劇場 銀月座の\n楽屋で殺されたのです。"
    - payne: "被害者はその夜、[wait 8]午後9時半\nまで舞台に立っておりました。"
    - payne: "これが、その夜の公演の\nプログラムですな。"
    - give: program
    - say: null
      text: "[speed 5]証拠品《公演プログラム》を\n法廷記録にファイルした。"
      color: blue
    - payne: "満員の客席の、数百人の観客が\n舞台の被害者を見ておるのです。"
    - payne: "そして9時35分。[wait 10]楽屋で遺体の\nそばにいたのが、被告人ですぞ！"
    - show: phoenix
      talk: 4
      idle: 3
    - phoenix: "（数百人の目撃者‥‥か。[wait 12]\n　これは手強いな）"
    - judge: "ふむう‥‥。[wait 10]\n話はわかりやすいですな。"
    - payne: "では、[wait 8]捜査を担当した刑事に\n話してもらいましょう。"
    - goto: detective

  # ---- 刑事の説明（尋問はない。事件のあらましと死亡推定時刻を知る） ----
  detective:
    - show: gumshoe
    - wait: 20
    - payne: "証人。[wait 8]\n名前と職業を。"
    - gumshoe: "糸鋸 圭介ッス！[wait 10]\n所轄署の刑事ッス！"
    - gumshoe: "この事件の捜査を\n担当しているッス。"
    - phoenix: "（‥‥なんだか、[wait 8]\n　元気な刑事さんだな）"
    - payne: "では刑事。[wait 10]\n事件のあらましを。"
    - gumshoe: "8月22日の夜、[wait 8]劇場 銀月座の\n楽屋で、男が殺されたッス。"
    - gumshoe: "被害者は、[wait 8]月岡 光一。"
    - gumshoe: "奇術師ゲッコウの名前で\n舞台に立っていた男ッス。"
    - gumshoe: "死因は、[wait 8]後頭部を\n殴られたことによる打撲ッス。"
    - gumshoe: "凶器は、楽屋にあった\nこの銀のトロフィーッス。"
    - give: trophy
    - say: null
      text: "[speed 5]証拠品《銀のトロフィー》を\n法廷記録にファイルした。"
      color: blue
    - gumshoe: "死亡推定時刻は、[wait 8]午後8時40分\nから9時40分のあいだッス。"
    - gumshoe: "遺体を見つけたのは、[wait 8]\n9時35分ごろ、被告人ッス。"
    - gumshoe: "通報したのは劇場の支配人で、\nワレワレが着いたのは9時50分。"
    - gumshoe: "現場の写真は、[wait 8]着いてすぐ、\n何も動かさずに撮ったッス！"
    - judge: "ふむう‥‥。[wait 10]\nよく分かりました。"
    - mia: "（死亡推定時刻と、[wait 8]発見の時刻。\n　覚えておきなさい、なるほどくん）"
    - payne: "ふふふ‥‥。[wait 10]では次に、[wait 8]\n被告人の話を聞きたいと思いますな。"
    - judge: "被告人を、証言台に？"
    - judge: "弁護側には不利になるかも\nしれませんが‥‥[wait 10]よろしいですかな？"
    - show: phoenix
      talk: 16
      idle: 15
    - phoenix: "（ど、どうしよう‥‥）"
    - mia: "なるほどくん。[wait 10]依頼人は\n殺していないと言ったのでしょう？"
    - mia: "だったら、[wait 8]\n胸を張って受けてあげなさい。"
    - phoenix: "‥‥かまいません。"
    - goto: accused

  # ---- 被告人を問いただす（被告人のウソを暴き、動機と目撃者につなぐ） ----
  accused:
    - show: akari
      talk: 254
      idle: 253
    - wait: 20
    - payne: "被告人。[wait 8]\n名前と職業を。"
    - akari: "ほ、星野 灯です。[wait 10]奇術師\nゲッコウの、弟子をしています。"
    - akari: "ふだんは、[wait 8]舞台の助手と、\n小道具の用意をしていて‥‥"
    - payne: "けっこう。[wait 10]では、事件の夜の\nことを話していただけますかな？"
    - akari: "は、はい。[wait 10]あの夜は、[wait 8]\n新しい公演の初日でした。"
    - akari: "休憩のあいだは、[wait 8]楽屋口の\nベンチに、ひとりでいました。"
