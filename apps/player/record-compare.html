<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法廷記録の比較</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101217; color: #e8e4da; font-family: "Hiragino Sans", system-ui, sans-serif; }
  main { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 18px; margin: 0; }
  p.note { margin: 0; font-size: 13px; color: #9aa0ab; }
  table { border-collapse: collapse; font-size: 13px; }
  th, td { padding: 2px 10px; border-bottom: 1px solid #2a2e36; text-align: left; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .case { display: flex; flex-direction: column; gap: 6px; }
  .case h2 { font-size: 14px; margin: 0; font-weight: normal; }
  .case h2 b { color: #f8c060; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
  figcaption { font-size: 12px; color: #9aa0ab; }
  canvas { display: block; image-rendering: pixelated; width: 512px; height: 384px; background: #000; }
  label { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>法廷記録の比較（DS 版の下画面 ／ 逆裁 ／ 違い。どれも 2 倍）</h1>
  <p class="note">違いの図: 暗い灰色 = DS 版、赤〜黄 = 色の差が大きい画素。ずれの割合は、どれかの色成分の差が 24 を超える画素の割合。色の差の平均は、画素ごとの色成分の差の最大（0〜255）の平均。</p>
  <label><input type="checkbox" id="blink"> DS 版とこちらを 0.5 秒ごとに切り替えて重ねる</label>
  <table id="summary"><thead><tr><th>画面</th><th>ファイル</th><th>ずれ</th><th>色の差の平均</th><th>メモ</th></tr></thead><tbody></tbody></table>
  <div id="cases"></div>
</main>
<script type="module" src="./src/record-compare.ts"></script>
</body>
</html>
