<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面の幅の確かめ</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101217; color: #e8e4da; font-family: "Hiragino Sans", system-ui, sans-serif; }
  main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  p.note { margin: 0; font-size: 13px; color: #9aa0ab; max-width: 60em; }
  #status { font-size: 14px; }
  #status b.ok { color: #7fd67f; }
  #status b.ng { color: #ff7a6a; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  table { border-collapse: collapse; font-size: 12px; }
  th, td { padding: 2px 8px; border-bottom: 1px solid #2a2e36; text-align: left; }
  td.ng { color: #ff7a6a; }
  .shots { display: flex; flex-wrap: wrap; gap: 10px; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 3px; }
  figcaption { font-size: 11px; color: #9aa0ab; max-width: 342px; }
  img { display: block; image-rendering: pixelated; background: #000; }
</style>
</head>
<body>
<main>
  <h1>画面の幅の確かめ（4:3 の画素が変わっていないか ／ 16:9 の見た目）</h1>
  <p class="note">
    章ごとに、各シーンの始めから数場面を決まった時刻・乱数で描き、4:3 の画素のハッシュを取ります。
    変更の前に「基準として保存」を押し（このブラウザに覚えます）、変更の後にこのページを開き直すと、基準と違う場面を赤で示します。
    ?cases=clocktower,ep1 で章を、?max=150 で章ごとの場面の数を、?wide=0 で 16:9 の絵を出さないようにできます。
  </p>
  <div id="status">描いています…</div>
  <div class="buttons">
    <button type="button" id="save" disabled>今の結果を基準として保存</button>
    <button type="button" id="copy" disabled>ハッシュを JSON でコピー</button>
  </div>
  <table id="table"><thead><tr><th>#</th><th>場面</th><th>4:3 のハッシュ</th><th>基準</th></tr></thead><tbody></tbody></table>
  <div class="shots" id="shots"></div>
</main>
<script type="module" src="./src/aspect-check.ts"></script>
</body>
</html>
