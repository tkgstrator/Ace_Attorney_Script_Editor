[package]
name = "aa-extract"
description = "ROM から素材を取り出して assets/ 以下に書き出す（aa-rom のコマンド版）"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
aa-rom = { path = "../aa-rom" }
rayon = { version = "1", optional = true }
